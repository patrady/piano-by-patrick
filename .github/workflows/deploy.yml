name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # Repo is served at /piano-by-patrick subpath on GitHub Pages.
          # Override with a GitHub variable if a custom domain is later configured at root.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/piano-by-patrick' }}
          # Add your Pushover keys as GitHub repository secrets
          NEXT_PUBLIC_PUSHOVER_TOKEN: ${{ secrets.NEXT_PUBLIC_PUSHOVER_TOKEN }}
          NEXT_PUBLIC_PUSHOVER_USER_KEY: ${{ secrets.NEXT_PUBLIC_PUSHOVER_USER_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
